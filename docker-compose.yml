services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Alle Datenbankdateien liegen dauerhaft im Projektordner unter ./data
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Fertiges Image aus der GitHub Container Registry (`docker compose pull`),
    # oder lokal bauen mit `docker compose up -d --build`. Version über AGENT_TAG in .env.
    image: ghcr.io/siliconserver/agent:${AGENT_TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      TZ: ${TZ:-Europe/Berlin}
      IMPRESSUM_URL: ${IMPRESSUM_URL:-}
      DATENSCHUTZ_URL: ${DATENSCHUTZ_URL:-}
    volumes:
      # DB-Dumps landen dauerhaft im Projektordner unter ./data/backups
      - ./data/backups:/data/backups
    ports:
      - "${AGENT_PORT:-8085}:8000"
