# Legt für die oberste Version in CHANGELOG.md automatisch Tag und GitHub-Release an,
# sobald sie auf main landet, und baut dazu das versionierte Docker-Image (docker.yml).
# Existiert der Tag schon, passiert nichts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.create.outputs.created }}
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version und Notizen aus CHANGELOG.md lesen
        id: changelog
        run: |
          version=$(awk '/^## /{print $2; exit}' CHANGELOG.md)
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Keine gültige Version oben in CHANGELOG.md gefunden: '$version'" >&2
            exit 1
          fi
          awk '/^## /{if (found) exit; found=1; next} found' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Release anlegen, falls noch nicht vorhanden
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits, nichts zu tun."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AGENT $VERSION" \
            --notes-file release-notes.md \
            --latest
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Ein vom GITHUB_TOKEN angelegtes Release startet keine anderen Workflows,
  # deshalb wird das Release-Image hier direkt gebaut. Manuell gestartet
  # ("Run workflow") wird das Image auch für ein schon bestehendes Release gebaut.
  image:
    needs: release
    if: needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
